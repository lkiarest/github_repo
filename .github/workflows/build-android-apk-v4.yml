name: Build Android APK v4 (clean rebuild)

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean flutter project
        run: |
          flutter create app
          cp -r xiaolongxia_voice_assistant/flutter_app/lib app/
          cp xiaolongxia_voice_assistant/flutter_app/pubspec.release.yaml app/pubspec.yaml || true
          cp app/lib/main_release_v4.dart app/lib/main.dart || true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*.apk
