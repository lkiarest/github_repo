name: Build Android APK (fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fix project structure
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: |
          rm -rf android ios

          flutter create . --platforms=android

          cp pubspec.release.yaml pubspec.yaml || true
          cp lib/main_release_v4.dart lib/main.dart || true

      - name: Pub get
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: xiaolongxia_voice_assistant/flutter_app/build/app/outputs/flutter-apk/*.apk
