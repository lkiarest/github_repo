name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ flutter-mobile ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: xiaolongxia_voice_assistant/flutter_app

      - name: Use release entry
        run: |
          cp lib/main_release_v3.dart lib/main.dart || true
        working-directory: xiaolongxia_voice_assistant/flutter_app

      - name: Build APK
        run: flutter build apk --debug
        working-directory: xiaolongxia_voice_assistant/flutter_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaolongxia-apk
          path: xiaolongxia_voice_assistant/flutter_app/build/app/outputs/flutter-apk/*.apk
