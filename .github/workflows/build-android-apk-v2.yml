name: Build Android APK v2

on:
  workflow_dispatch:
  push:
    branches: [ flutter-mobile ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project files
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: |
          if [ ! -f pubspec.yaml ] && [ -f pubspec.release.yaml ]; then
            cp pubspec.release.yaml pubspec.yaml
          fi
          if [ -f lib/main_release_v3.dart ]; then
            cp lib/main_release_v4.dart lib/main.dart
          fi
          ls -la

      - name: Verify Flutter project root
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: |
          test -f pubspec.yaml
          grep '^name:' pubspec.yaml

      - name: Flutter pub get
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: xiaolongxia_voice_assistant/flutter_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaolongxia-apk
          path: xiaolongxia_voice_assistant/flutter_app/build/app/outputs/flutter-apk/*.apk
