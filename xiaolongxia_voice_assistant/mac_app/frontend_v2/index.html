<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>小龙虾语音助手</title>
<style>
body{margin:0;font-family:-apple-system;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.container{max-width:420px;margin:60px auto;padding:20px}
.card{background:#111827;border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
h1{text-align:center;margin:10px 0}
.status{display:flex;justify-content:center;margin:10px}
.badge{padding:6px 12px;border-radius:20px;background:#374151}
.badge.on{background:#22c55e}
.controls{text-align:center;margin:20px}
button{padding:12px 24px;border:none;border-radius:12px;margin:5px;font-size:14px;cursor:pointer}
.start{background:#22c55e}
.stop{background:#ef4444}
.log{margin-top:20px;height:150px;overflow:auto;background:#020617;padding:10px;border-radius:10px;font-size:12px}
.chat{margin-top:20px}
.msg{margin:6px 0;padding:8px 10px;border-radius:10px}
.user{background:#1d4ed8;text-align:right}
.ai{background:#374151}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🦞 小龙虾</h1>
<div class="status"><span id="badge" class="badge">未连接</span></div>
<div class="controls">
<button class="start" onclick="start()">启动</button>
<button class="stop" onclick="stop()">停止</button>
</div>
<div class="chat" id="chat"></div>
<div class="log" id="log"></div>
</div>
</div>
<script>
async function start(){await fetch('http://127.0.0.1:8000/start',{method:'POST'})}
async function stop(){await fetch('http://127.0.0.1:8000/stop',{method:'POST'})}
async function refresh(){
 try{
  const res=await fetch('http://127.0.0.1:8000/status');
  const data=await res.json();
  const badge=document.getElementById('badge');
  badge.innerText=data.running?'运行中':'已停止';
  badge.className='badge '+(data.running?'on':'');
  document.getElementById('log').innerText=data.logs.join('\n');
  const chat=document.getElementById('chat');
  chat.innerHTML='';
  data.events.forEach(e=>{
    const div=document.createElement('div');
    div.className='msg '+(e.kind==='user'?'user':'ai');
    div.innerText=e.text;
    chat.appendChild(div);
  })
 }catch(e){}
}
setInterval(refresh,1000)
</script>
</body>
</html>
