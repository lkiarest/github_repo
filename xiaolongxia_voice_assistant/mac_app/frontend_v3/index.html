<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小龙虾语音助手</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(17, 24, 39, 0.82);
      --panel-2: rgba(15, 23, 42, 0.75);
      --border: rgba(255,255,255,0.08);
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #10a37f;
      --accent-2: #34d399;
      --danger: #ef4444;
      --user: #1d4ed8;
      --assistant: #111827;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(16,163,127,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(37,99,235,0.14), transparent 24%),
        linear-gradient(180deg, #0b1020 0%, #0f172a 100%);
      overflow: hidden;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 88px 1fr 320px;
      gap: 16px;
      padding: 16px;
    }

    .sidebar, .main, .rightbar {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
      box-shadow: var(--shadow);
      border-radius: 24px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
    }

    .brand {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: linear-gradient(135deg, rgba(16,163,127,0.25), rgba(52,211,153,0.15));
      border: 1px solid rgba(255,255,255,0.08);
    }

    .nav-col { display: flex; flex-direction: column; gap: 10px; }
    .nav-btn {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      transition: .2s ease;
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }

    .main {
      display: grid;
      grid-template-rows: 92px 1fr 118px;
      overflow: hidden;
    }

    .topbar {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 rgba(52,211,153,0.55);
    }
    .dot.on {
      background: var(--accent-2);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.55); }
      70% { box-shadow: 0 0 0 12px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }

    .chat-scroll {
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .welcome {
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(16,163,127,0.13), rgba(29,78,216,0.09));
      border: 1px solid rgba(255,255,255,0.06);
    }
    .welcome h2 { margin: 0 0 8px; font-size: 20px; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.6; }

    .message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .message-row.user { justify-content: flex-end; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex: 0 0 auto;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .bubble {
      max-width: min(78%, 740px);
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .message-row.user .bubble {
      background: linear-gradient(180deg, rgba(29,78,216,0.92), rgba(30,64,175,0.92));
      border-bottom-right-radius: 8px;
    }
    .message-row.assistant .bubble {
      background: rgba(15,23,42,0.8);
      border-bottom-left-radius: 8px;
    }
    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .composer {
      padding: 18px 20px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      background: linear-gradient(180deg, rgba(15,23,42,0.12), rgba(15,23,42,0.42));
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 14px;
      min-height: 64px;
    }
    .input-shell textarea {
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      max-height: 100px;
    }
    .ghost { color: var(--muted); }

    .action-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      border: none;
      border-radius: 16px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: .2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), #0f766e);
    }
    .btn-muted {
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-danger {
      color: white;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
    }

    .rightbar {
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }
    .panel {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }
    .panel:last-child { border-bottom: none; overflow: auto; }
    .panel h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mini-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
    }
    .mini-card .label { color: var(--muted); font-size: 12px; }
    .mini-card .value { font-size: 18px; margin-top: 6px; font-weight: 700; }

    .wave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      margin-top: 4px;
    }
    .bar {
      width: 6px;
      background: linear-gradient(180deg, var(--accent-2), #60a5fa);
      border-radius: 999px;
      animation: wave 1.1s infinite ease-in-out;
      opacity: .35;
    }
    .bar:nth-child(1){ height: 10px; animation-delay: .0s; }
    .bar:nth-child(2){ height: 18px; animation-delay: .1s; }
    .bar:nth-child(3){ height: 28px; animation-delay: .2s; }
    .bar:nth-child(4){ height: 18px; animation-delay: .3s; }
    .bar:nth-child(5){ height: 10px; animation-delay: .4s; }
    .bar.active { opacity: 1; }
    @keyframes wave {
      0%,100% { transform: scaleY(.55); }
      50% { transform: scaleY(1.15); }
    }

    .log-box {
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #cbd5e1;
      height: 100%;
      overflow: auto;
      white-space: pre-wrap;
    }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 88px 1fr; }
      .rightbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="nav-col">
        <div class="brand">🦞</div>
        <button class="nav-btn active">💬</button>
        <button class="nav-btn">🎙️</button>
        <button class="nav-btn">⚙️</button>
      </div>
      <div class="nav-col">
        <button class="nav-btn">🌙</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title-wrap">
          <h1>小龙虾语音助手</h1>
          <p>本地 OpenClaw · Piper · Whisper · Porcupine</p>
        </div>
        <div class="status-pill">
          <span id="dot" class="dot"></span>
          <span id="statusText">未连接后端</span>
        </div>
      </div>

      <div class="chat-scroll" id="chatScroll">
        <div class="welcome">
          <h2>欢迎回来</h2>
          <p>现在你可以像使用 ChatGPT 一样查看最近对话、启动语音助手、观察状态切换，并在菜单栏里常驻运行。</p>
        </div>
      </div>

      <div class="composer">
        <div class="input-shell">
          <div class="ghost">⌘K</div>
          <textarea id="prompt" rows="1" placeholder="这里先作为预留输入框，后续可以接文字对话与设置搜索…"></textarea>
        </div>
        <div class="action-group">
          <button class="btn btn-muted" onclick="refreshStatus()">刷新</button>
          <button class="btn btn-primary" onclick="startVoice()">启动</button>
          <button class="btn btn-danger" onclick="stopVoice()">停止</button>
        </div>
      </div>
    </main>

    <aside class="rightbar">
      <div class="panel">
        <h3>运行状态</h3>
        <div class="stat-grid">
          <div class="mini-card">
            <div class="label">当前模式</div>
            <div id="modeValue" class="value">待机</div>
          </div>
          <div class="mini-card">
            <div class="label">运行时长</div>
            <div id="uptimeValue" class="value">-</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>语音活动</h3>
        <div class="wave" id="wave">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </div>

      <div class="panel">
        <h3>实时日志</h3>
        <div id="logBox" class="log-box">等待后端连接...</div>
      </div>
    </aside>
  </div>

  <script>
    const API = 'http://127.0.0.1:8000';
    const chatScroll = document.getElementById('chatScroll');
    const logBox = document.getElementById('logBox');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const modeValue = document.getElementById('modeValue');
    const uptimeValue = document.getElementById('uptimeValue');
    const waveBars = [...document.querySelectorAll('.bar')];
    let lastEventKey = '';

    function escapeHtml(text) {
      return (text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function fmtUptime(sec) {
      if (!sec && sec !== 0) return '-';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function setWave(active) {
      waveBars.forEach(bar => bar.classList.toggle('active', active));
    }

    function pushMessage(kind, text, ts) {
      const key = `${kind}:${text}:${ts || ''}`;
      if (key === lastEventKey) return;
      lastEventKey = key;

      const row = document.createElement('div');
      row.className = `message-row ${kind === 'user' ? 'user' : 'assistant'}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = kind === 'user' ? '你' : '🦞';

      const body = document.createElement('div');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = escapeHtml(text);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = kind === 'user' ? '你' : '小龙虾';

      body.appendChild(bubble);
      body.appendChild(meta);

      if (kind === 'user') {
        row.appendChild(body);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(body);
      }

      chatScroll.appendChild(row);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    async function startVoice() {
      await fetch(`${API}/start`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      refreshStatus();
    }

    async function stopVoice() {
      await fetch(`${API}/stop`, { method: 'POST' });
      refreshStatus();
    }

    async function refreshStatus() {
      try {
        const res = await fetch(`${API}/status`);
        const data = await res.json();

        const running = !!data.running;
        statusText.textContent = running ? '语音助手运行中' : '语音助手已停止';
        dot.classList.toggle('on', running);
        modeValue.textContent = running ? '在线' : '待机';
        uptimeValue.textContent = fmtUptime(data.uptime_seconds);
        setWave(running);

        logBox.textContent = (data.logs || []).join('\n') || '暂无日志';
        logBox.scrollTop = logBox.scrollHeight;

        (data.events || []).slice(-8).forEach(evt => {
          if (evt.kind === 'user' || evt.kind === 'assistant') {
            pushMessage(evt.kind, evt.text, evt.ts);
          }
        });
      } catch (err) {
        statusText.textContent = '未连接后端';
        dot.classList.remove('on');
        modeValue.textContent = '离线';
        setWave(false);
      }
    }

    document.getElementById('prompt').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = `${Math.min(this.scrollHeight, 100)}px`;
    });

    refreshStatus();
    setInterval(refreshStatus, 1200);
  </script>
</body>
</html>
