<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
body{background:#0b1020;color:white;text-align:center;font-family:sans-serif}
.wave{display:flex;justify-content:center;gap:6px;margin-top:40px}
.bar{width:6px;height:20px;background:#10a37f;animation:wave 1s infinite}
.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.5)}}
</style>
</head>
<body>
<h2>🎙️ AI 正在说话...</h2>
<div class="wave">
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>
</body>
</html>
